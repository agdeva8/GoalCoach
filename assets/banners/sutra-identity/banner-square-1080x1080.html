<!doctype html>

<title>Sutra - Social Square Post / OpenGraph (1080x1080)</title>
<style>
  :root {

    --gold: #F2C795;
    --deep: #0D0A08;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1080px; height: 1080px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
  }
  .bg-glow {
    position: absolute;
    width: 650px;
    height: 650px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201, 123, 63, 0.25) 0%, rgba(201, 123, 63, 0) 70%);
    top: 140px;
    z-index: 0;
  }
  .visual {
    width: 440px;
    height: 440px;
    margin-bottom: 24px;
    position: relative;
    z-index: 1;
  }
  .visual svg {
    width: 440px;
    height: 440px;
  }
  h1 {
    font-family: 'Iowan Old Style', 'Palatino', Georgia, serif;
    font-size: 76px;
    margin: 0 0 12px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #FFFDF9;
    z-index: 1;
  }
  .tagline {
    font-size: 28px;
    color: var(--gold);
    font-weight: 400;
    margin: 0 0 20px;
    z-index: 1;
  }
  .subtext {
    font-size: 16.5px;

    margin: 0;
