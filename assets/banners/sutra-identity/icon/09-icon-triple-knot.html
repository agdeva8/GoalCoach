<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon 09 - Triple-Loop Knot</title>
<style>
  :root { --cream:#F7F2E7; --saffron:#C97B3F; --ink:#1F1B16; }
  html,body{margin:0;padding:0;background:var(--cream);}
  .stage{width:1024px;height:1024px;display:grid;place-items:center;}
  .sq{width:820px;height:820px;border-radius:240px;
      background:radial-gradient(circle at 30% 28%,#F2C795 0%,var(--saffron) 55%,#8E4E22 100%);
      display:grid;place-items:center;
      box-shadow:0 40px 100px -30px rgba(143,78,34,0.45);}
  svg{width:560px;height:560px;}
</style>
</head>
<body>
<div class="stage"><div class="sq">
<!-- Three interlocked loops (tri-knot / trefoil) = past, present, future sorted -->
<svg viewBox="0 0 200 200" fill="none" stroke="#F7F2E7" stroke-width="9" stroke-linecap="round">
  <circle cx="80"  cy="80"  r="22"/>
  <circle cx="120" cy="80"  r="22"/>
  <circle cx="100" cy="118" r="22"/>
  <!-- center thread that ties them together -->
  <path d="M 100 100 L 100 138" opacity="0.7" stroke-width="5"/>
</svg>
</div></div>
</body></html>
