<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon 13 - Guru Sorting Multi-Threads (v3)</title>
<style>
  :root { --cream:#F7F2E7; --saffron:#C97B3F; --ink:#1F1B16; }
  html,body{margin:0;padding:0;background:var(--cream);}
  .stage{width:1024px;height:1024px;display:grid;place-items:center;}
  .sq{width:820px;height:820px;border-radius:240px;
      background:radial-gradient(circle at 30% 28%,#F2C795 0%,var(--saffron) 55%,#8E4E22 100%);
      display:grid;place-items:center;
      box-shadow:0 40px 100px -30px rgba(143,78,34,0.45);}
  svg{width:580px;height:580px;}
</style>
</head>
<body>
<div class="stage"><div class="sq">
<svg viewBox="0 0 200 200" fill="none">
  <!-- Multi-thread loom above guru: 4 strands going from messy left to sorted right -->
  <!-- Common origin (tangled) -->
  <g stroke="#F7F2E7" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 38 90 C 60 96, 86 102, 116 96"/>
    <path d="M 38 100 C 62 104, 90 110, 116 104"/>
    <path d="M 38 110 C 64 112, 92 118, 116 112"/>
    <path d="M 38 120 C 66 122, 92 124, 116 120"/>
  </g>
  <!-- Sorted right side (parallel, evenly spaced) -->
  <g stroke="#F7F2E7" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95">
    <line x1="116" y1="80" x2="170" y2="78"/>
    <line x1="116" y1="100" x2="170" y2="98"/>
    <line x1="116" y1="120" x2="170" y2="118"/>
    <line x1="116" y1="140" x2="170" y2="138"/>
  </g>
  <!-- Tangled blob on left -->
  <path d="M 38 90 C 30 100, 30 110, 38 120" stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <circle cx="34" cy="105" r="4" stroke="#F7F2E7" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- Guru: smaller, sitting below the loom, hands raised sorting threads -->
  <!-- Halo -->
  <circle cx="100" cy="62" r="14" fill="#F7F2E7" opacity="0.18"/>
  <!-- Head + bun -->
  <circle cx="100" cy="64" r="8" fill="#F7F2E7"/>
  <circle cx="100" cy="54" r="4" fill="#F7F2E7"/>
  <!-- Torso -->
  <path d="M 84 82 Q 100 76 116 82 L 122 122 Q 100 130 78 122 Z" fill="#F7F2E7"/>
  <!-- Crossed legs base (grounded) -->
  <path d="M 64 124 Q 100 136 136 124 L 142 144 Q 100 152 58 144 Z" fill="#F7F2E7"/>

  <!-- LEFT arm: reaches up-left toward tangled blob -->
  <path d="M 86 86 C 70 88, 56 92, 46 100" stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- RIGHT arm: reaches up-right toward sorted side -->
  <path d="M 114 86 C 128 90, 138 94, 146 102" stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Closed eyes + bindi -->
  <path d="M 96 64 q 1.4 1 2.8 0" stroke="#8E4E22" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M 102 64 q 1.4 1 2.8 0" stroke="#8E4E22" stroke-width="1" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="60" r="0.9" fill="#8E4E22"/>
</svg>
</div></div>
</body></html>
