<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon 12 - Guru Pulling Thread Apart (v2)</title>
<style>
  :root { --cream:#F7F2E7; --saffron:#C97B3F; --ink:#1F1B16; }
  html,body{margin:0;padding:0;background:var(--cream);}
  .stage{width:1024px;height:1024px;display:grid;place-items:center;}
  .sq{width:820px;height:820px;border-radius:240px;
      background:radial-gradient(circle at 30% 28%,#F2C795 0%,var(--saffron) 55%,#8E4E22 100%);
      display:grid;place-items:center;
      box-shadow:0 40px 100px -30px rgba(143,78,34,0.45);}
  svg{width:580px;height:580px;}
</style>
</head>
<body>
<div class="stage"><div class="sq">
<svg viewBox="0 0 200 200" fill="none">
  <!-- Two strands being pulled apart from a center knot, fanning outward -->
  <!-- LEFT strand pulled up -->
  <path d="M 90 110 C 78 92, 70 78, 64 70"
        stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- RIGHT strand pulled down-right -->
  <path d="M 110 110 C 122 128, 132 142, 142 154"
        stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Tiny knot at center -->
  <ellipse cx="100" cy="112" rx="10" ry="6" stroke="#F7F2E7" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- Guru: profile 3/4 turned, both hands actively pulling -->
  <!-- Halo -->
  <circle cx="100" cy="56" r="16" fill="#F7F2E7" opacity="0.18"/>
  <!-- Head + bun -->
  <circle cx="100" cy="58" r="9.5" fill="#F7F2E7"/>
  <circle cx="100" cy="46" r="4.8" fill="#F7F2E7"/>
  <!-- Torso (slightly wider to convey engaged shoulders) -->
  <path d="M 78 78 Q 100 71 122 78 L 130 122 Q 100 130 70 122 Z" fill="#F7F2E7"/>
  <!-- Crossed legs -->
  <path d="M 56 124 Q 100 138 144 124 L 150 146 Q 100 156 50 146 Z" fill="#F7F2E7"/>

  <!-- LEFT arm reaches up-left to grab the lifted strand -->
  <path d="M 82 84 C 74 86, 68 78, 64 70" stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- RIGHT arm reaches down-right to grab the trailing strand -->
  <path d="M 118 84 C 128 100, 136 124, 142 154" stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Hand grips (small dots at strand endpoints) -->
  <circle cx="64" cy="70" r="3" fill="#F7F2E7"/>
  <circle cx="142" cy="154" r="3" fill="#F7F2E7"/>

  <!-- Closed eyes + bindi -->
  <path d="M 95 58 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M 102 58 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="1" stroke-linecap="round" fill="none"/>
  <circle cx="100" cy="54" r="0.9" fill="#8E4E22"/>
</svg>
</div></div>
</body></html>
