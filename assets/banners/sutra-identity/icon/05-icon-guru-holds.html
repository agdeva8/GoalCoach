<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon - Guru Holds Thread</title>
<style>
  :root {
    --cream: #F7F2E7;
    --saffron: #C97B3F;
    --ink: #1F1B16;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); }
  .stage { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .sq {
    width: 820px; height: 820px; border-radius: 240px;
    background: radial-gradient(circle at 30% 28%, #F2C795 0%, var(--saffron) 55%, #8E4E22 100%);
    display: grid; place-items: center;
    box-shadow: 0 40px 100px -30px rgba(143, 78, 34, 0.45);
  }
  svg { width: 560px; height: 560px; }
</style>
</head>
<body>
<div class="stage">
  <div class="sq">
    <svg viewBox="0 0 200 200" fill="none">
      <!-- Thread being held: long sweeping curve from hand down through field -->
      <path d="M 70 55 C 100 50, 130 65, 145 90 C 160 115, 150 145, 125 160 C 100 175, 70 170, 55 150"
            stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

      <!-- Guru: head + body + simple seated silhouette -->
      <!-- Halo (subtle disc behind head) -->
      <circle cx="100" cy="60" r="14" fill="#F7F2E7" opacity="0.18"/>

      <!-- Head -->
      <circle cx="100" cy="62" r="9" fill="#F7F2E7"/>
      <!-- Bun on top -->
      <circle cx="100" cy="50" r="4.5" fill="#F7F2E7"/>

      <!-- Shoulders + torso (triangular robe) -->
      <path d="M 78 80 Q 100 72 122 80 L 130 130 Q 100 138 70 130 Z" fill="#F7F2E7"/>

      <!-- Crossed legs base -->
      <path d="M 60 132 Q 100 142 140 132 L 145 150 Q 100 160 55 150 Z" fill="#F7F2E7"/>

      <!-- Left arm: holds thread up high -->
      <path d="M 82 82 C 78 70, 72 62, 70 55"
            stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Right arm: extended out, holding thread mid -->
      <path d="M 118 82 C 130 85, 142 88, 145 90"
            stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>

      <!-- Hands (small dots at thread grip points) -->
      <circle cx="70" cy="55" r="2.6" fill="#F7F2E7"/>
      <circle cx="145" cy="90" r="2.6" fill="#F7F2E7"/>

      <!-- Eyes (closed, contemplative) -->
      <path d="M 96 62 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <path d="M 101 62 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
</div>
</body>
</html>
