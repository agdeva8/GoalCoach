<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon 07 - Guru Meditates with Coiled Thread</title>
<style>
  :root { --cream:#F7F2E7; --saffron:#C97B3F; --ink:#1F1B16; }
  html,body{margin:0;padding:0;background:var(--cream);}
  .stage{width:1024px;height:1024px;display:grid;place-items:center;}
  .sq{width:820px;height:820px;border-radius:240px;
      background:radial-gradient(circle at 30% 28%,#F2C795 0%,var(--saffron) 55%,#8E4E22 100%);
      display:grid;place-items:center;
      box-shadow:0 40px 100px -30px rgba(143,78,34,0.45);}
  svg{width:560px;height:560px;}
</style>
</head>
<body>
<div class="stage"><div class="sq">
<svg viewBox="0 0 200 200" fill="none">
  <!-- Coiled thread mandala around guru -->
  <ellipse cx="100" cy="110" rx="58" ry="14" stroke="#F7F2E7" stroke-width="2.5" opacity="0.45"/>
  <ellipse cx="100" cy="110" rx="48" ry="11" stroke="#F7F2E7" stroke-width="2.5" opacity="0.6"/>
  <ellipse cx="100" cy="110" rx="38" ry="8"  stroke="#F7F2E7" stroke-width="2.5" opacity="0.8"/>

  <!-- Halo behind head -->
  <circle cx="100" cy="62" r="18" fill="#F7F2E7" opacity="0.2"/>
  <!-- Head + bun -->
  <circle cx="100" cy="62" r="10" fill="#F7F2E7"/>
  <circle cx="100" cy="49" r="5"  fill="#F7F2E7"/>
  <!-- Torso (lotus seated) -->
  <path d="M 76 80 Q 100 72 124 80 L 132 120 Q 100 130 68 120 Z" fill="#F7F2E7"/>
  <!-- Crossed legs base -->
  <path d="M 56 122 Q 100 134 144 122 L 150 142 Q 100 152 50 142 Z" fill="#F7F2E7"/>
  <!-- Hands resting in lap (dhyana mudra) -->
  <ellipse cx="100" cy="118" rx="14" ry="5" fill="#8E4E22" opacity="0.35"/>
  <!-- Closed eyes -->
  <path d="M 95 63 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  <path d="M 102 63 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  <!-- A wisp of thread rising from lap -->
  <path d="M 100 115 C 96 100, 104 92, 100 80" stroke="#F7F2E7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
</div></div>
</body></html>
