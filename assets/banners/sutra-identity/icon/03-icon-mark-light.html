<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon - Mark on Ink</title>
<style>
  :root {
    --cream: #F7F2E7;
    --saffron: #C97B3F;
    --ink: #1F1B16;
  }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  .stage { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .mark { width: 560px; height: 560px; border-radius: 50%; background: var(--cream); position: relative; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(247,242,231,0.08); }
  .mark svg { width: 300px; height: 300px; }
</style>
</head>
<body>
<div class="stage">
  <div class="mark">
    <svg viewBox="0 0 200 200" fill="none" stroke="#C97B3F" stroke-width="16" stroke-linecap="round">
      <path d="M100 30 C 160 30, 170 90, 130 110 C 90 130, 50 110, 50 80 C 50 50, 90 40, 110 60 C 130 80, 110 120, 80 140 C 50 160, 30 150, 30 130" />
    </svg>
  </div>
</div>
</body>
</html>
