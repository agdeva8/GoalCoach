<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon 08 - Devanagari स Ligature</title>
<style>
  :root { --cream:#F7F2E7; --saffron:#C97B3F; --ink:#1F1B16; }
  html,body{margin:0;padding:0;background:var(--cream);}
  .stage{width:1024px;height:1024px;display:grid;place-items:center;}
  .sq{width:820px;height:820px;border-radius:240px;
      background:radial-gradient(circle at 30% 28%,#F2C795 0%,var(--saffron) 55%,#8E4E22 100%);
      display:grid;place-items:center;
      box-shadow:0 40px 100px -30px rgba(143,78,34,0.45);}
  svg{width:560px;height:560px;}
</style>
</head>
<body>
<div class="stage"><div class="sq">
<!-- Stylized Devanagari 'स' (sa) read as a continuous thread loop, the first letter of 'Sutra' -->
<svg viewBox="0 0 200 200" fill="none" stroke="#F7F2E7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
  <!-- Top bar (shirorekha) implied by the thread arc -->
  <path d="M 50 60 C 100 30, 160 30, 175 60" />
  <!-- S-curve that traces 'स' shape -->
  <path d="M 60 60 C 50 80, 60 100, 95 100 C 130 100, 130 130, 95 130 C 60 130, 60 160, 130 160" />
</svg>
</div></div>
</body></html>
