<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon 11 - Guru Untying Thread (v1)</title>
<style>
  :root { --cream:#F7F2E7; --saffron:#C97B3F; --ink:#1F1B16; }
  html,body{margin:0;padding:0;background:var(--cream);}
  .stage{width:1024px;height:1024px;display:grid;place-items:center;}
  .sq{width:820px;height:820px;border-radius:240px;
      background:radial-gradient(circle at 30% 28%,#F2C795 0%,var(--saffron) 55%,#8E4E22 100%);
      display:grid;place-items:center;
      box-shadow:0 40px 100px -30px rgba(143,78,34,0.45);}
  svg{width:580px;height:580px;}
</style>
</head>
<body>
<div class="stage"><div class="sq">
<svg viewBox="0 0 200 200" fill="none">
  <!-- Knot: small open bow being loosened -->
  <path d="M 92 128 C 84 124, 84 116, 92 116 C 100 116, 100 124, 108 124 C 116 124, 116 116, 108 116"
        stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- Tail trailing down + to the right (already loosened) -->
  <path d="M 108 124 C 122 130, 138 140, 150 156"
        stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- Pulled-up strand -->
  <path d="M 92 116 C 86 100, 84 88, 86 80"
        stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Guru: clean silhouette, both hands engaged -->
  <!-- Halo -->
  <circle cx="100" cy="60" r="16" fill="#F7F2E7" opacity="0.18"/>
  <!-- Head + bun -->
  <circle cx="100" cy="62" r="9.5" fill="#F7F2E7"/>
  <circle cx="100" cy="50" r="4.8" fill="#F7F2E7"/>
  <!-- Torso (slim triangular robe, slightly leaning forward to engage hands) -->
  <path d="M 80 82 Q 100 75 120 82 L 128 122 Q 100 130 72 122 Z" fill="#F7F2E7"/>
  <!-- Crossed legs base (lotus seat) -->
  <path d="M 58 124 Q 100 138 142 124 L 148 146 Q 100 156 52 146 Z" fill="#F7F2E7"/>

  <!-- LEFT arm: pulls the loose strand up -->
  <path d="M 84 88 C 84 95, 85 105, 86 114" stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- RIGHT arm: pulls the trailing tail to the side -->
  <path d="M 116 88 C 120 100, 124 115, 128 124" stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Hand grips -->
  <circle cx="86" cy="114" r="2.8" fill="#F7F2E7"/>
  <circle cx="128" cy="124" r="2.8" fill="#F7F2E7"/>

  <!-- Closed eyes (calm focus) -->
  <path d="M 95 62 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="1" stroke-linecap="round" fill="none"/>
  <path d="M 102 62 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="1" stroke-linecap="round" fill="none"/>
  <!-- Subtle bindi/dot on forehead -->
  <circle cx="100" cy="58" r="0.9" fill="#8E4E22"/>
</svg>
</div></div>
</body></html>
