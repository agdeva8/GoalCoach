<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon - Monogram</title>
<style>
  :root {
    --cream: #F7F2E7;
    --saffron: #C97B3F;
    --ink: #1F1B16;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); }
  .stage { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .sq { width: 720px; height: 720px; border-radius: 180px; background: linear-gradient(155deg, #F2C795 0%, var(--saffron) 60%, #8E4E22 100%); display: grid; place-items: center; box-shadow: 0 40px 100px -30px rgba(143, 78, 34, 0.45); }
  .sq .s { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 500; font-size: 460px; color: var(--cream); line-height: 1; margin-top: -20px; }
</style>
</head>
<body>
<div class="stage">
  <div class="sq"><div class="s">s</div></div>
</div>
</body>
</html>
