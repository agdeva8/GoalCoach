<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Icon - Guru Untangles Knot</title>
<style>
  :root {
    --cream: #F7F2E7;
    --saffron: #C97B3F;
    --ink: #1F1B16;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); }
  .stage { width: 1024px; height: 1024px; display: grid; place-items: center; }
  .sq {
    width: 820px; height: 820px; border-radius: 240px;
    background: radial-gradient(circle at 30% 28%, #F2C795 0%, var(--saffron) 55%, #8E4E22 100%);
    display: grid; place-items: center;
    box-shadow: 0 40px 100px -30px rgba(143, 78, 34, 0.45);
  }
  svg { width: 580px; height: 580px; }
</style>
</head>
<body>
<div class="stage">
  <div class="sq">
    <svg viewBox="0 0 200 200" fill="none">
      <!-- Knot being untangled: figure-8 / pretzel crossing in lower-mid -->
      <path d="M 80 130 C 60 130, 60 150, 80 150 C 100 150, 100 130, 120 130 C 140 130, 140 150, 120 150"
            stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9"/>
      <!-- Strand pulled up from knot (being sorted) -->
      <path d="M 80 130 C 78 110, 75 95, 72 85"
            stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
      <!-- Trailing strand below -->
      <path d="M 120 150 C 125 162, 128 170, 132 175"
            stroke="#F7F2E7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

      <!-- Guru: contemplative figure working the knot -->
      <circle cx="100" cy="58" r="13" fill="#F7F2E7" opacity="0.18"/>
      <circle cx="100" cy="62" r="9" fill="#F7F2E7"/>
      <circle cx="100" cy="50" r="4.5" fill="#F7F2E7"/>

      <!-- Torso -->
      <path d="M 80 82 Q 100 75 120 82 L 126 125 Q 100 132 74 125 Z" fill="#F7F2E7"/>

      <!-- Left arm reaches down to knot -->
      <path d="M 84 86 C 82 100, 80 115, 80 130"
            stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Right arm rests near knot -->
      <path d="M 116 86 C 118 105, 120 125, 120 145"
            stroke="#F7F2E7" stroke-width="5" stroke-linecap="round" fill="none"/>

      <!-- Hand dots at grip -->
      <circle cx="80" cy="130" r="2.6" fill="#F7F2E7"/>
      <circle cx="120" cy="145" r="2.6" fill="#F7F2E7"/>

      <!-- Eyes (closed, focused) -->
      <path d="M 96 62 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="0.9" stroke-linecap="round" fill="none"/>
      <path d="M 101 62 q 1.5 1 3 0" stroke="#8E4E22" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    </svg>
  </div>
</div>
</body>
</html>
