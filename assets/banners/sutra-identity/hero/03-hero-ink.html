<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Hero - Ink (Dark)</title>
<style>
  :root {
    --cream: #F7F2E7;
    --saffron: #C97B3F;
    --ink: #1F1B16;
    --muted: #8B7E6B;
  }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  .stage { width: 1500px; height: 500px; display: grid; grid-template-columns: 240px 1fr; align-items: center; padding: 0 90px; box-sizing: border-box; }
  .mark { width: 200px; height: 200px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; }
  .mark svg { width: 120px; height: 120px; }
  .copy { padding-left: 56px; }
  .word { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 500; font-size: 140px; letter-spacing: -3px; color: var(--cream); line-height: 1; }
  .tag { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-weight: 400; font-size: 26px; color: var(--saffron); margin-top: 12px; letter-spacing: 0.4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="mark">
    <svg viewBox="0 0 200 200" fill="none" stroke="#C97B3F" stroke-width="16" stroke-linecap="round">
      <path d="M100 30 C 160 30, 170 90, 130 110 C 90 130, 50 110, 50 80 C 50 50, 90 40, 110 60 C 130 80, 110 120, 80 140 C 50 160, 30 150, 30 130" />
    </svg>
  </div>
  <div class="copy">
    <div class="word">Sutra</div>
    <div class="tag">let's sort your life - together.</div>
  </div>
</div>
</body>
</html>
