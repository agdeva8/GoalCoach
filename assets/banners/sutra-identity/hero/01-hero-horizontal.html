<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sutra Hero - Horizontal Lockup</title>
<style>
  :root {
    --cream: #F7F2E7;
    --saffron: #C97B3F;
    --ink: #1F1B16;
    --muted: #8B7E6B;
  }
  html, body { margin: 0; padding: 0; background: var(--cream); }
  .stage { width: 1500px; height: 500px; display: grid; grid-template-columns: 280px 1fr; align-items: center; padding: 0 80px; box-sizing: border-box; }
  .mark { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 30% 28%, #F2C795 0%, var(--saffron) 55%, #8E4E22 100%); display: grid; place-items: center; box-shadow: 0 18px 50px -16px rgba(143, 78, 34, 0.35); }
  .mark svg { width: 130px; height: 130px; }
  .copy { padding-left: 48px; }
  .word { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-weight: 500; font-size: 130px; letter-spacing: -3px; color: var(--ink); line-height: 1; }
  .tag { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; font-weight: 400; font-size: 28px; color: var(--muted); margin-top: 10px; letter-spacing: 0.3px; }
</style>
</head>
<body>
<div class="stage">
  <div class="mark">
    <svg viewBox="0 0 200 200" fill="none" stroke="#F7F2E7" stroke-width="14" stroke-linecap="round">
      <path d="M100 30 C 160 30, 170 90, 130 110 C 90 130, 50 110, 50 80 C 50 50, 90 40, 110 60 C 130 80, 110 120, 80 140 C 50 160, 30 150, 30 130" />
    </svg>
  </div>
  <div class="copy">
    <div class="word">Sutra</div>
    <div class="tag">let's sort your life - together.</div>
  </div>
</div>
</body>
</html>
