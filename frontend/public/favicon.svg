<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded Squircle Background in Deep Ink -->
  <rect width="32" height="32" rx="7.5" fill="#1F1B16"/>

  <!-- Halo / Wisdom Glow -->
  <circle cx="16" cy="9.5" r="5" fill="url(#haloGlow)" opacity="0.45"/>
  <circle cx="16" cy="9.5" r="4" stroke="#F2C795" stroke-width="0.8" opacity="0.35"/>

  <!-- Guru Head & Topknot in Silk Cream -->
  <circle cx="16" cy="9.6" r="2.2" fill="#F7F2E7"/>
  <circle cx="16" cy="6.6" r="1.1" fill="#F7F2E7"/>

  <!-- Seated Torso & Mudra Arms -->
  <path d="M 12 14.5 C 13.5 13, 18.5 13, 20 14.5 L 21 19.5 C 18 20.5, 14 20.5, 11 19.5 Z" fill="#F7F2E7" opacity="0.95"/>
  <path d="M 12 14.5 C 10.5 16.5, 9.8 18.5, 11.5 19" stroke="#F7F2E7" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 20 14.5 C 21.5 16.5, 22.2 18.5, 20.5 19" stroke="#F7F2E7" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="11.5" cy="19" r="0.75" fill="#F2C795"/>
  <circle cx="20.5" cy="19" r="0.75" fill="#F2C795"/>

  <!-- Lotus Base (Folded legs) -->
  <path d="M 6.8 23.2 C 11 25.2, 21 25.2, 25.2 23.2 C 23.5 26.2, 8.5 26.2, 6.8 23.2 Z" fill="#F7F2E7" opacity="0.85"/>

  <!-- The Infinite Thread (Lemniscate Figure-8) in Warm Gold / Saffron -->
  <path d="M 16 17.5 C 12.5 14, 6 14.5, 6 18.5 C 6 22.5, 12.5 23, 16 19.5 C 19.5 16, 26 15, 26 18.5 C 26 22, 19.5 22, 16 17.5 Z"
        stroke="url(#threadGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 16 17.5 C 12.5 14, 6 14.5, 6 18.5 C 6 22.5, 12.5 23, 16 19.5 C 19.5 16, 26 15, 26 18.5 C 26 22, 19.5 22, 16 17.5 Z"
        stroke="#FFF8EE" stroke-width="0.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <defs>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2C795"/>
      <stop offset="100%" stop-color="#C97B3F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="threadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C795"/>
      <stop offset="50%" stop-color="#C97B3F"/>
      <stop offset="100%" stop-color="#F2C795"/>
    </linearGradient>
  </defs>
</svg>
